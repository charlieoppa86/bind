name: bind_app
description: "BIND - 지금 여기, 같은 주제의 사람과 바로 대화"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  cloud_firestore: ^7.1.0
  cloud_functions: ^7.0.1
  firebase_analytics: ^13.0.1
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  geolocator: ^14.1.2
  go_router: ^18.1.4
  google_sign_in: ^7.2.0
  intl: ^0.20.3
  material_ui: ^1.1.0
  shared_preferences: ^2.5.6
  sign_in_with_apple: ^8.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true

  # Firebase iOS SDK는 CocoaPods에 최신 버전이 없어 SPM으로 받는다.
  config:
    enable-swift-package-manager: true

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
