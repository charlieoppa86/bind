name: bind_app
description: "BIND - 지금 여기, 같은 주제의 사람과 바로 대화"
publish_to: 'none'
version: 0.1.0+2

environment:
  sdk: ^3.14.0

dependencies:
  cloud_firestore: ^7.1.0
  cloud_functions: ^7.0.1
  firebase_analytics: ^13.0.1
  firebase_app_check: ^0.5.2
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_crashlytics: ^6.1.0
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.2
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  google_sign_in: ^7.2.0
  intl: ^0.20.3
  material_ui: ^1.1.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true

  assets:
    # Google 공식 로그인 에셋(signin-assets.zip, Dark·아이콘)에서 G 로고 부분만 잘라냄. 수정·재채색 금지
    - assets/images/

  # Firebase iOS SDK는 CocoaPods에 최신 버전이 없어 SPM으로 받는다.
  config:
    enable-swift-package-manager: true

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700

# 홈 화면 앱 아이콘: `dart run flutter_launcher_icons`로 Android·iOS 크기별 아이콘 생성
# 원본: assets/images/app_icon.png 로고의 그라데이션 마크만 잘라, 배경은 AppColors.canvas(#17171C)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#17171C"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  # 전경 이미지에 이미 안전 영역 여백이 있어 추가 여백(기본 16%)은 0
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21
